name: Build WA OneSecond Demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect Android SDK
      - name: Detect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMAN" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 4. Install SDK
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Extract project ZIP
      - name: Extract Android project
        run: |
          ZIP="WA-OneSecond-Android-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found: $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | sort

      # 7. Locate Gradle project
      - name: Locate Gradle project
        run: |
          APP_BUILD=$(find extracted -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            | head -1)

          if [ -z "$APP_BUILD" ]; then
            echo "app/build.gradle not found"

            find extracted -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \)

            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")
          PROJECT_DIR=$(dirname "$APP_DIR")

          echo "APP_DIR=$APP_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] \
            && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "settings.gradle missing"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] \
            && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then

            echo "Root build.gradle missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 8. Build APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      # 9. Verify APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not generated"
            find "$PROJECT_DIR" -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-OneSecond-Demo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error