name: Build OneSecond APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_VERSION: '17'

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect SDK
      - name: Detect Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found: $SDK"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$SDK" -maxdepth 5 -type f
            exit 1
          fi

          echo "SDK: $SDK"
          echo "SDKMANAGER: $SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      # 4. Android SDK licenses
      - name: Accept SDK licenses
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses < /dev/null || true

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      # 5. Install SDK platform
      - name: Install Android Platform 35
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "platforms;android-35"

      # 6. Install Build Tools
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "build-tools;35.0.0"

      # 7. Install Platform Tools
      - name: Install Platform Tools
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install "platform-tools"

      # 8. Verify SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK verification successful"

          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

          echo "Installed build tools:"
          ls "$ANDROID_HOME/build-tools"

      # 9. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 10. Detect project
      - name: Detect project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "app/build.gradle" ] || \
             [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          fi

          if [ -z "$PROJECT_DIR" ]; then
            FILE=$(find . -type f \
              \( -path "*/app/build.gradle" \
              -o -path "*/app/build.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -n "$FILE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$FILE")")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP=$(find . -maxdepth 3 \
              -type f -name "*.zip" \
              | head -n 1)

            if [ -n "$ZIP" ]; then
              mkdir -p extracted
              unzip -o "$ZIP" -d extracted

              FILE=$(find extracted -type f \
                \( -path "*/app/build.gradle" \
                -o -path "*/app/build.gradle.kts" \) \
                | head -n 1)

              if [ -n "$FILE" ]; then
                PROJECT_DIR=$(dirname "$(dirname "$FILE")")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project detected: $PROJECT_DIR"

      # 11. Validate
      - name: Validate project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "settings.gradle missing"
            exit 1
          fi

          if [ ! -f build.gradle ] && \
             [ ! -f build.gradle.kts ]; then
            echo "Root build.gradle missing"
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "AndroidManifest.xml missing"
            exit 1
          fi

          echo "Project validation successful"

      # 12. Build
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 13. Verify
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 14. Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneSecond-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14