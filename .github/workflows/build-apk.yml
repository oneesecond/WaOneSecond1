name: Build WA OneSecond Demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Detect Android SDK
      - name: Detect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -name sdkmanager \
            -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 4. Install Android SDK
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Locate Android project
      - name: Locate Gradle project
        run: |
          echo "Searching for Android project..."

          echo "Repository structure:"
          find . -maxdepth 5 -type f | sort

          APP_BUILD=$(find . -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -not -path './.git/*' \
            | head -1)

          if [ -z "$APP_BUILD" ]; then
            echo "ERROR: app/build.gradle not found"

            echo "Searching all Gradle files:"
            find . -type f \
              \( -name build.gradle \
              -o -name build.gradle.kts \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \)

            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")
          PROJECT_DIR=$(dirname "$APP_DIR")

          echo "App directory: $APP_DIR"
          echo "Project directory: $PROJECT_DIR"

          # Create settings.gradle if missing
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] \
            && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "Creating settings.gradle"

            cat > "$PROJECT_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WAOneSecond"
          include ':app'
          EOF
          fi

          # Validate project root
          if [ ! -f "$PROJECT_DIR/build.gradle" ] \
            && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then

            echo "Root build.gradle not found"
            echo "Project: $PROJECT_DIR"

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Build APK
      - name: Build APK
        run: |
          echo "Building project: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk"

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-OneSecond-Demo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error