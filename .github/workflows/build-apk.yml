name: Build WA OneSecond Demo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          ZIP="WA-OneSecond-Android-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP project tidak ditemukan"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          find extracted -type f | sort

      - name: Locate Gradle project
        run: |
          APP_BUILD=$(find extracted -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            | head -1)

          if [ -z "$APP_BUILD" ]; then
            echo "app/build.gradle tidak ditemukan"
            find extracted -type f
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD")
          PROJECT_DIR=$(dirname "$APP_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan"
            find "$PROJECT_DIR" -name "*.apk"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-OneSecond-Demo-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error