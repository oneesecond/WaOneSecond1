name: Build OneSecond APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: '17'
      ANDROID_PLATFORM: '35'
      BUILD_TOOLS_VERSION: '35.0.0'

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Accept SDK licenses
      - name: Accept Android licenses
        run: |
          set -e
          yes | sdkmanager --licenses || true

      # 5. Install required SDK
      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          sdkmanager --list_installed

      # 6. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Detect project
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "app/build.gradle" ] || \
             [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            PROJECT_FILE=$(find . -type f \
              \( -path "*/app/build.gradle" \
              -o -path "*/app/build.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -n 1)

            if [ -n "$PROJECT_FILE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")
            fi
          fi

          # Extract ZIP if Android project is not found
          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -name "*.zip" \
              | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting: $ZIP_FILE"

              mkdir -p extracted
              unzip -o "$ZIP_FILE" -d extracted

              PROJECT_FILE=$(find extracted -type f \
                \( -path "*/app/build.gradle" \
                -o -path "*/app/build.gradle.kts" \) \
                | head -n 1)

              if [ -n "$PROJECT_FILE" ]; then
                PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Expected app/build.gradle"
            echo "Repository files:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Project detected successfully"
          echo "Project: $PROJECT_DIR"
          echo "================================"

          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      # 8. Validate Android configuration
      - name: Validate Android configuration
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          echo "Android project validation successful."

      # 9. Build APK
      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. Find APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching build outputs..."

            find "$PROJECT_DIR" \
              -type f \
              \( -name "*.apk" \
              -o -name "*.aab" \)

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "================================"
          echo "BUILD SUCCESS"
          echo "APK: $APK"
          echo "================================"

          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneSecond-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14